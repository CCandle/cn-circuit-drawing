name: Render demo previews

on:
  push:
    paths:
      - "demo/**"
      - ".github/workflows/render-demo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-lang-chinese texlive-pictures poppler-utils

      - name: Build the three-sheet PDF
        working-directory: demo
        run: xelatex -interaction=nonstopmode -halt-on-error demo.tex

      - name: Export review images
        run: |
          mkdir -p demo/rendered
          cp demo/demo.pdf demo/rendered/cn-circuit-drawing-demo-0.1.pdf
          pdftoppm -png -r 135 demo/demo.pdf demo/rendered/sheet

      - name: Commit rendered previews
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: refresh demo previews [skip ci]"
          file_pattern: "demo/rendered/*"
